name: Build RootHidePatcher

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - auto-fixed-paths-v2

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build iOS app
        run: |
          set -eux
          xcodebuild -project RootHidePatcher.xcodeproj -scheme RootHidePatcher -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGNING_ALLOWED=NO build

      - name: Verify bundled analyzer
        run: |
          set -eux
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/Patcher.app"
          echo "APP=$APP"
          find "$GITHUB_WORKSPACE/build/Build/Products" -maxdepth 3 -print
          test -d "$APP"
          test -f "$APP/roothide_fixed_path_analyzer.sh"
          bash -n "$APP/patch.sh"
          bash -n "$APP/roothide_fixed_path_analyzer.sh"

      - name: Analyzer integration test
        run: |
          set -eux
          APP="$GITHUB_WORKSPACE/build/Build/Products/Release-iphoneos/Patcher.app"
          mkdir -p diagnostics
          cat > fixture.c <<'EOF'
          extern void consume(const char *);
          __attribute__((visibility("default"))) void fixture(void) {
              consume("/var/log/roothide-auto-test.log");
              consume("/var/mobile/Library/Preferences/keep-rootfs.plist");
          }
          EOF
          clang -target arm64-apple-macos11 -dynamiclib fixture.c -o fixture.dylib
          otool -v -s __TEXT __cstring fixture.dylib > diagnostics/cstring.txt 2>&1 || true
          otool -t -v -V fixture.dylib > diagnostics/disasm.txt 2>&1 || true
          bash "$APP/roothide_fixed_path_analyzer.sh" fixture.dylib fixture.plist > diagnostics/analyzer.log 2>&1 || true
          plutil -convert xml1 -o - fixture.plist > diagnostics/fixture.xml 2>&1 || true
          cat diagnostics/cstring.txt
          cat diagnostics/disasm.txt
          cat diagnostics/analyzer.log
          cat diagnostics/fixture.xml
          grep -q '<string>jbroot</string>' diagnostics/fixture.xml
          if grep -q 'keep-rootfs.plist' diagnostics/fixture.xml; then exit 1; fi
          grep -q '<string>cstring</string>' diagnostics/fixture.xml

      - name: Upload analyzer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RootHidePatcher-analyzer-log-${{ github.sha }}
          path: diagnostics
          if-no-files-found: warn

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: RootHidePatcher-${{ github.sha }}
          path: build/Build/Products/Release-iphoneos/Patcher.app
          if-no-files-found: error
